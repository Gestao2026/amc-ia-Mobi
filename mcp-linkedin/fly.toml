# mcp-linkedin. Configuracao conceitual do Fly.io (Etapa 6B).
#
# Nenhum app foi criado no Fly.io ainda; este arquivo e preparacao,
# nao execucao. Nome do app e regiao sao conceituais, a confirmar
# antes do primeiro deploy real. Sem volume e sem secrets aqui: a
# decisao do backend de producao do TokenStore fica para uma etapa
# propria, e nenhum secret real e configurado neste arquivo.

app = "mcp-linkedin"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
